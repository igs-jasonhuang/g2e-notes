<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex, nofollow">
<title>G2E 2026 清單</title>
<style>
  :root { --ink:#1f2933; --muted:#6b7280; --line:#d1d5db; --bg:#f3f4f6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif; color:var(--ink); background:var(--bg); font-size:15px; line-height:1.45; }
  header { background:#111827; color:#fff; padding:12px 14px calc(10px + env(safe-area-inset-top)); position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:17px; }
  header .sub { font-size:12px; color:#cbd5e1; margin-top:3px; white-space:nowrap; }
  header .legend { font-size:11.5px; color:#e5e7eb; margin-top:5px; line-height:1.4; display:flex; flex-wrap:wrap; gap:2px 10px; white-space:nowrap; }
  .tools { display:flex; gap:6px; flex-wrap:wrap; padding:8px 10px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:4; }
  .tools button { font:inherit; font-size:12px; padding:5px 9px; border:1px solid var(--line); border-radius:14px; background:#fff; color:var(--ink); }
  .tools button.on { background:#111827; color:#fff; border-color:#111827; }
  main { max-width:760px; margin:0 auto; padding:10px 10px 90px; }
  section { background:#fff; border:1px solid var(--line); border-radius:10px; margin:10px 0; overflow:hidden; }
  section h2 { font-size:15px; margin:0; padding:8px 10px 8px 12px; background:#f9fafb; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px; cursor:pointer; user-select:none; -webkit-user-select:none; }
  section h2 .right { display:flex; align-items:center; gap:8px; flex:none; }
  .fold { font:inherit; font-size:14px; width:32px; height:28px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); padding:0; line-height:1; transition:transform .15s; }
  section.folded .fold { transform:rotate(-90deg); }
  section.folded .note, section.folded table { display:none; }
  section.folded h2 { border-bottom:none; }
  section h2 .booth { font-size:12px; color:var(--muted); font-weight:normal; white-space:nowrap; }
  section h2 .cnt { font-size:12px; color:var(--muted); font-weight:normal; }
  section .note { font-size:12px; color:var(--muted); padding:6px 12px 0; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  td.body { overflow-wrap:anywhere; }
  tr { border-top:1px solid #eee; } tr:first-child { border-top:none; }
  td { padding:9px 8px; vertical-align:top; }
  td.ck { width:40px; padding-left:12px; } td.ck input { width:22px; height:22px; margin:2px 0 0; }
  td.pri { width:30px; padding-left:0; padding-right:0; font-size:15px; }
  td.body b { display:block; font-size:15px; }
  td.body .what { font-size:13px; color:#374151; margin-top:2px; }
  td.body .ours { display:inline-block; font-size:11px; color:#92400e; background:#fef3c7; border-radius:8px; padding:1px 7px; margin-top:4px; }
  td.body .ours.none { background:#f3f4f6; color:var(--muted); }
  tr.done td.body b, tr.done td.body .what { color:var(--muted); text-decoration:line-through; }
  tr.done td.body .ours { opacity:.55; }
  tr.hide { display:none; }
  .bar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); padding:8px 10px calc(8px + env(safe-area-inset-bottom)); display:flex; flex-wrap:wrap; gap:6px; justify-content:center; z-index:5; }
  .bar button { font:inherit; font-size:13px; padding:8px 10px; white-space:nowrap; border-radius:8px; border:1px solid var(--line); background:#fff; }
  .bar button.primary { background:#111827; color:#fff; border-color:#111827; }
  dialog { border:1px solid var(--line); border-radius:12px; padding:16px; max-width:calc(100vw - 24px); width:420px; font:inherit; margin:auto; }
  dialog textarea { width:100%; font:inherit; font-size:14px; min-height:64px; border:1px solid var(--line); border-radius:8px; padding:8px; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
  dialog button { font:inherit; font-size:13px; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; }
  .small { font-size:12px; color:var(--muted); }
  .src { display:inline-block; font-size:10px; padding:1px 5px; border-radius:7px; margin-left:6px; vertical-align:middle; font-weight:normal; }
  .src.w { background:#e0e7ff; color:#3730a3; }
  .src.g { background:#dcfce7; color:#166534; }
  td.nt { width:46px; padding-right:10px; text-align:right; }
  .note-btn { font-size:14px; width:36px; height:30px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--muted); padding:0; }
  .note-btn.has { background:#fef3c7; border-color:#d97706; color:#92400e; }
  .nf { margin:9px 0; }
  .nf label { font-size:12px; color:var(--muted); display:block; margin-bottom:3px; }
  .nf input[type=text], .nf select { width:100%; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:6px; padding:7px 8px; background:#fffdf7; }
  .nf textarea { width:100%; font:inherit; font-size:14px; min-height:72px; border:1px solid var(--line); border-radius:6px; padding:7px 8px; background:#fffdf7; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips label { font-size:12px; border:1px solid var(--line); border-radius:12px; padding:4px 9px; background:#fff; display:flex; gap:5px; align-items:center; margin:0; color:var(--ink); }
  .chips input { width:16px; height:16px; margin:0; }
  .nf2 { display:flex; gap:16px; align-items:center; margin:9px 0; }
  .nf2 > div { flex:1; }
  #noteDlg, #expDlg { max-height:86vh; overflow:auto; }
  #lock { max-width:420px; margin:18vh auto 0; padding:20px; background:#fff; border:1px solid var(--line); border-radius:12px; }
  #lock input { width:100%; font:inherit; font-size:17px; padding:10px; border:1px solid var(--line); border-radius:8px; margin:10px 0; }
  #lock button { width:100%; font:inherit; font-size:15px; padding:10px; border-radius:8px; border:none; background:#111827; color:#fff; }
  #lock .err { color:#b91c1c; font-size:13px; min-height:18px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>G2E 2026 攤位必看清單</h1>
  <div class="sub" id="progress">請輸入密碼</div>
  <div class="legend"><span>🔴 必看（移植相關／今年趨勢）</span><span>🟡 值得看</span><span>🟢 順路</span></div>
</header>
<div id="lock">
  <b>輸入密碼解鎖</b>
  <p class="small" style="margin:6px 0 0">內容已加密存放；密碼只在這支手機記住，按底部「鎖定」可清除。</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="密碼" inputmode="text">
  <div class="err" id="err"></div>
  <button onclick="unlock()">解鎖</button>
</div>
<div class="tools hidden" id="tools">
  <button id="fAll" class="on" onclick="setFilter('all')">全部</button>
  <button id="fRed" onclick="setFilter('red')">只看 🔴</button>
  <button id="fTodo" onclick="setFilter('todo')">只看未勾</button>
  <button id="fSure" onclick="setFilter('sure')">只看確定展出</button>
  <button id="fFold" onclick="toggleAll()" style="margin-left:auto">收合全部</button>
</div>
<main id="main"></main>
<div class="bar hidden" id="bar">
  <button class="primary" onclick="openCode()">狀態碼</button>
  <button onclick="exportNotes()">筆記md</button>
  <button onclick="exportHers()">筆記JSON</button>
  <button onclick="resetAll()">全部清除</button>
  <button onclick="lock()">鎖定</button>
</div>
<dialog id="dlg">
  <b>狀態碼</b>
  <p class="small" style="margin:6px 0">勾完按「複製」貼到備忘錄或 LINE 群。<b>還原</b>＝用這串碼覆蓋我的勾選；<b>合併</b>＝把別人的碼加進來（他看過的也算看過，我的不會少）。</p>
  <textarea id="code"></textarea>
  <div class="small" id="lastT" style="margin-top:4px"></div>
  <div class="row"><button onclick="copyCode()">複製</button><button onclick="restoreCode()">還原</button><button onclick="mergeCode()">合併</button><button onclick="document.getElementById('dlg').close()">關閉</button></div>
</dialog>
<dialog id="noteDlg">
  <b id="nTitle">筆記</b>
  <div class="nf"><label>疊了什麼（標配之上，一句話）</label><input type="text" id="n_layer"></div>
  <div class="nf"><label>機制（可複選）</label><div class="chips" id="n_mech"></div></div>
  <div class="nf"><label>題材</label><div class="chips" id="n_theme"></div></div>
  <div class="nf2">
    <div><label>移植適配（1 難～5 易）</label><select id="n_fit"><option value="">–</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
    <div style="padding-top:16px"><label style="display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" id="n_photo" style="width:20px;height:20px;margin:0"> 已拍照</label></div>
  </div>
  <div class="nf"><label>Bet 分級怎麼推（檔位／解鎖什麼）</label><input type="text" id="n_bet"></div>
  <div class="nf"><label>Bonus 節奏（多久觸發／體感）</label><input type="text" id="n_pace"></div>
  <div class="nf"><label>備註</label><textarea id="n_memo"></textarea></div>
  <div class="row"><button onclick="clearNote()">清除此筆</button><button onclick="saveNote()">儲存</button><button onclick="document.getElementById('noteDlg').close()">關閉</button></div>
</dialog>
<dialog id="expDlg">
  <b>機台筆記匯出</b>
  <p class="small" style="margin:6px 0">按「複製」貼到 LINE／備忘錄帶回；回台丟給 AI 直接進 wiki。</p>
  <textarea id="expText" style="min-height:180px"></textarea>
  <div class="row"><button onclick="copyExp()">複製</button><button onclick="document.getElementById('expDlg').close()">關閉</button></div>
</dialog>

let DATA = null, ALL = [], filter = 'all';

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(PAYLOAD.iv)}, key, b64d(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(pwOverride){
  const pw = pwOverride ?? document.getElementById('pw').value;
  const err = document.getElementById('err'); err.textContent = '';
  try {
    DATA = await decrypt(pw); ALL = DATA.flatMap(g=>g.items.map(it=>it[0]));
    localStorage.setItem(PFX+'_pw', pw);
    document.getElementById('lock').classList.add('hidden');
    document.getElementById('tools').classList.remove('hidden');
    document.getElementById('bar').classList.remove('hidden');
    render(); fixSticky();
  } catch(e) { if (pwOverride === undefined) err.textContent = '密碼不對'; }
}
function lock(){ localStorage.removeItem(PFX+'_pw'); location.reload(); }

function get(id){ return localStorage.getItem(PFX+id)==='1'; }
function set(id,v){ localStorage.setItem(PFX+id, v?'1':'0'); localStorage.setItem(PFX+'_t', new Date().toISOString()); }
function render(){
  const m = document.getElementById('main'); m.innerHTML='';
  DATA.forEach(g=>{
    const sec = document.createElement('section');
    const done = g.items.filter(it=>get(it[0])).length;
    sec.innerHTML = '<h2><span>'+g.v+' <span class="booth">'+g.booth+'</span></span><span class="right"><span class="cnt" data-cnt="'+g.v+'">'+done+'/'+g.items.length+'</span><button class="fold" type="button" aria-label="收合／展開">▾</button></span></h2>' + (g.note?'<div class="note">'+g.note+'</div>':'') + '<table><tbody></tbody></table>';
    const tb = sec.querySelector('tbody');
    g.items.forEach(([id,pri,name,what,ours,src])=>{
      const tr = document.createElement('tr'); tr.dataset.id=id; tr.dataset.pri=pri; tr.dataset.src=src||'';
      tr.innerHTML = '<td class="ck"><input type="checkbox" '+(get(id)?'checked':'')+'></td><td class="pri">'+pri+'</td><td class="body"><b>'+name+(src?'<span class="src '+(src===_G?'g':'w')+'">'+src+'</span>':'')+'</b><div class="what">'+what+'</div><span class="ours '+(ours?'':'none')+'">'+(ours?'對應：'+ours:'—')+'</span></td><td class="nt"><button class="note-btn'+(hasNote(id)?' has':'')+'" type="button" aria-label="筆記">✎</button></td>';
      tr.classList.toggle('done', get(id));
      const cb = tr.querySelector('input');
      cb.addEventListener('change', ()=>{ set(id, cb.checked); tr.classList.toggle('done', cb.checked); refresh(); });
      tr.addEventListener('click', e=>{ if(e.target.closest('.note-btn')) return; if(e.target.tagName!=='INPUT'){ cb.checked=!cb.checked; cb.dispatchEvent(new Event('change')); } });
      tr.querySelector('.note-btn').addEventListener('click', e=>{ e.stopPropagation(); openNote(id); });
      tb.appendChild(tr);
    });
    sec.dataset.v = g.v; if(localStorage.getItem(PFX+'fold_'+g.v)==='1') sec.classList.add('folded');
    sec.querySelector('h2').addEventListener('click', ()=>{ const f=!sec.classList.contains('folded'); sec.classList.toggle('folded', f); localStorage.setItem(PFX+'fold_'+g.v, f?'1':'0'); updateFoldBtn(); });
    m.appendChild(sec);
  });
  refresh(); updateFoldBtn();
}
function refresh(){
  const total = ALL.length, done = ALL.filter(get).length;
  const cnt = c => { const xs=DATA.flatMap(g=>g.items).filter(it=>it[1]===c); return xs.filter(it=>get(it[0])).length+'/'+xs.length; };
  document.getElementById('progress').textContent = '已看 '+done+'/'+total+'｜🔴 '+cnt('🔴')+'｜🟡 '+cnt('🟡')+'｜🟢 '+cnt('🟢');
  DATA.forEach(g=>{ const el=document.querySelector('[data-cnt="'+g.v+'"]'); if(el) el.textContent = g.items.filter(it=>get(it[0])).length+'/'+g.items.length; });
  document.querySelectorAll('tr[data-id]').forEach(tr=>{ const d=get(tr.dataset.id), r=tr.dataset.pri==='🔴'; const sv=tr.dataset.src||'';
    tr.classList.toggle('hide', (filter==='red'&&!r)||(filter==='todo'&&d)||(filter==='sure'&&sv===_W)); });
  document.querySelectorAll('section').forEach(s=>{ s.style.display = s.querySelectorAll('tr[data-id]:not(.hide)').length?'':'none'; });
}
function updateFoldBtn(){ const secs=[...document.querySelectorAll('section')]; const anyOpen=secs.some(x=>!x.classList.contains('folded')); const b=document.getElementById('fFold'); if(b) b.textContent = anyOpen?'收合全部':'展開全部'; }
function toggleAll(){ const secs=[...document.querySelectorAll('section')]; const anyOpen=secs.some(x=>!x.classList.contains('folded')); secs.forEach(x=>{ x.classList.toggle('folded', anyOpen); localStorage.setItem(PFX+'fold_'+x.dataset.v, anyOpen?'1':'0'); }); updateFoldBtn(); }
function setFilter(f){ filter=f; ['All','Red','Todo','Sure'].forEach(x=>document.getElementById('f'+x).classList.toggle('on', x.toLowerCase()===f)); refresh(); }
function resetAll(){ if(!confirm('清除這支手機上的所有勾選？（建議先複製狀態碼備份）')) return; ALL.forEach(id=>localStorage.removeItem(PFX+id)); localStorage.removeItem(PFX+'_t'); render(); }
function encode(){ let n=0n; ALL.forEach((id,i)=>{ if(get(id)) n |= (1n<<BigInt(i)); }); return 'G1-'+n.toString(36); }
function parseBits(s){ s=(s||'').trim(); if(!s.startsWith('G1-')) throw new Error('格式不對，應以 G1- 開頭'); const v=parseInt(s.slice(3),36); if(Number.isNaN(v)||v<0) throw new Error('解析失敗'); return BigInt(v); }
function decode(s, merge){ let n=parseBits(s); if(merge){ let cur=0n; ALL.forEach((id,i)=>{ if(get(id)) cur |= (1n<<BigInt(i)); }); n |= cur; } ALL.forEach((id,i)=>set(id, Boolean((n>>BigInt(i))&1n))); }
function openCode(){ document.getElementById('code').value = encode(); const t=localStorage.getItem(PFX+'_t'); document.getElementById('lastT').textContent = t?('最後勾選 '+t.slice(5,16).replace('T',' ')):''; document.getElementById('dlg').showModal(); }
function copyCode(){ const ta=document.getElementById('code'); ta.select(); try{ navigator.clipboard.writeText(ta.value); }catch(e){ document.execCommand('copy'); } alert('已複製，貼到備忘錄保存'); }
function restoreCode(){ try{ decode(document.getElementById('code').value); render(); document.getElementById('dlg').close(); alert('已還原'); }catch(e){ alert('還原失敗：'+e.message); } }
function mergeCode(){ const s=document.getElementById('code').value; if(s.trim()===encode()){ alert('這是你自己的狀態碼；請先把別人的碼貼進來再按合併'); return; } const before=ALL.filter(get).length; try{ decode(s, true); render(); document.getElementById('dlg').close(); alert('已合併：新增 '+(ALL.filter(get).length-before)+' 項'); }catch(e){ alert('合併失敗：'+e.message); } }
const NL = String.fromCharCode(10);
const NOTE_MECH = ['單層 H&S','多層 H&S','跨局累積','輪盤','盤面擴大','Bet 綁功能','消除類','家族續作','Cash Collect','JP 收集'];
const NOTE_THEME = ['亞洲皮','歐美','IP 授權'];
let noteId = null;
function noteKey(id){ return PFX+'note_'+id; }
function getNote(id){ try{ return JSON.parse(localStorage.getItem(noteKey(id))||'null'); }catch(e){ return null; } }
function hasNote(id){ const n=getNote(id); return !!(n&&(n.layer||n.memo||n.bet||n.pace||n.fit||n.photo||(n.mech&&n.mech.length)||(n.theme&&n.theme.length))); }
function initChips(){ const mk=(host,arr)=>{ if(host.childElementCount) return; arr.forEach(v=>{ const l=document.createElement('label'); const c=document.createElement('input'); c.type='checkbox'; c.value=v; l.appendChild(c); l.appendChild(document.createTextNode(v)); host.appendChild(l); }); }; mk(document.getElementById('n_mech'),NOTE_MECH); mk(document.getElementById('n_theme'),NOTE_THEME); }
function machineInfo(id){ let r=null; DATA.forEach(g=>g.items.forEach(it=>{ if(it[0]===id) r={v:g.v,name:it[2]}; })); return r; }
function openNote(id){ initChips(); noteId=id; const info=machineInfo(id); document.getElementById('nTitle').textContent='✎ '+info.name+'（'+info.v+'）'; const n=getNote(id)||{};
  document.getElementById('n_layer').value=n.layer||''; document.getElementById('n_bet').value=n.bet||''; document.getElementById('n_pace').value=n.pace||''; document.getElementById('n_fit').value=n.fit||''; document.getElementById('n_photo').checked=!!n.photo; document.getElementById('n_memo').value=n.memo||'';
  document.querySelectorAll('#n_mech input').forEach(c=>c.checked=(n.mech||[]).includes(c.value));
  document.querySelectorAll('#n_theme input').forEach(c=>c.checked=(n.theme||[]).includes(c.value));
  document.getElementById('noteDlg').showModal(); }
function saveNote(){ if(!noteId) return; const n={ layer:document.getElementById('n_layer').value.trim(), mech:[...document.querySelectorAll('#n_mech input:checked')].map(c=>c.value), theme:[...document.querySelectorAll('#n_theme input:checked')].map(c=>c.value), fit:document.getElementById('n_fit').value, bet:document.getElementById('n_bet').value.trim(), pace:document.getElementById('n_pace').value.trim(), photo:document.getElementById('n_photo').checked, memo:document.getElementById('n_memo').value.trim(), t:new Date().toISOString() };
  localStorage.setItem(noteKey(noteId), JSON.stringify(n)); document.getElementById('noteDlg').close(); syncNoteBtn(noteId); }
function clearNote(){ if(!noteId) return; if(!confirm('清除這台的筆記？')) return; localStorage.removeItem(noteKey(noteId)); document.getElementById('noteDlg').close(); syncNoteBtn(noteId); }
function syncNoteBtn(id){ const tr=document.querySelector('tr[data-id="'+id+'"]'); if(tr){ const b=tr.querySelector('.note-btn'); if(b) b.classList.toggle('has', hasNote(id)); } }
function exportNotes(){ const L=['# G2E 2026 機台筆記（'+new Date().toISOString().slice(0,16).replace('T',' ')+'）','']; let c=0;
  DATA.forEach(g=>g.items.forEach(it=>{ const id=it[0]; if(!hasNote(id)) return; const n=getNote(id)||{}; c++;
    L.push('## '+it[2]+'（'+g.v+'）');
    if(n.layer) L.push('- 疊了什麼：'+n.layer);
    const tags=[]; if(n.mech&&n.mech.length) tags.push('機制：'+n.mech.join('、')); if(n.theme&&n.theme.length) tags.push('題材：'+n.theme.join('、')); if(n.fit) tags.push('適配：'+n.fit+'/5'); if(n.photo) tags.push('已拍照');
    if(tags.length) L.push('- '+tags.join('｜'));
    if(n.bet) L.push('- Bet 分級：'+n.bet);
    if(n.pace) L.push('- Bonus 節奏：'+n.pace);
    if(n.memo) L.push('- 備註：'+n.memo.split(NL).join(' ／ '));
    L.push(''); }));
  if(!c){ alert('還沒有任何筆記；點每台機台右側的 ✎ 開始記'); return; }
  document.getElementById('expText').value=L.join(NL); document.getElementById('expDlg').showModal(); }
function exportHers(){
  const out=[]; const now=new Date().toISOString();
  DATA.forEach(g=>g.items.forEach(it=>{ const [id,pri,name,what,ours,src]=it; if(!get(id)&&!hasNote(id)) return;
    const n=getNote(id)||{}; const seg=[];
    if(n.layer) seg.push('疊了什麼：'+n.layer);
    if(n.bet) seg.push('Bet 分級：'+n.bet);
    if(n.pace) seg.push('Bonus 節奏：'+n.pace);
    if(n.fit) seg.push('移植適配：'+n.fit+'/5');
    if(n.memo) seg.push(n.memo);
    out.push({ id:'MJ-'+id, name:name.replace(/<[^>]*>/g,''), vendor:g.v, kind:'實體遊戲',
      location:'現場觀察', locationDetail:'IGS 運營一組（黃宋禎）G2E 2026 現場',
      work:'未確認', description:what, tags:(n.mech||[]), styles:(n.theme||[]),
      artNotes:'', mediaIds:[], links:[], sources:[], todo:'',
      g2e:src===_G?'明確提及':'未明示', priority:pri===_R?'必看':'值得看',
      seen:get(id), notes:seg.length?[{text:seg.join(' ／ '), createdAt:now}]:[],
      sourceNote:'來源＝IGS 運營視角現場筆記（攤位必看清單匯出）；與 EKG／LinkedIn 事前資料為不同來源。',
      createdAt:now, updatedAt:now, userEdited:true, archived:false }); }));
  if(!out.length){ alert('還沒有勾選或筆記可匯出'); return; }
  const pack={ format:'g2e-field-notes', schema:1, exportedAt:now, scope:'igs-ops-field-notes',
               records:out, vendors:[], media:[] };
  const blob=new Blob([JSON.stringify(pack,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='IGS運營現場筆記_'+now.slice(0,10)+'.json'; a.click();
  alert('已下載 '+out.length+' 筆（g2e-field-notes 格式，可交給研發一組匯入）');
}
function copyExp(){ const ta=document.getElementById('expText'); ta.select(); try{ navigator.clipboard.writeText(ta.value); }catch(e){ document.execCommand('copy'); } alert('已複製'); }

document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });
const saved = localStorage.getItem(PFX+'_pw'); if (saved) unlock(saved);
</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex, nofollow">
<title>G2E 2026 清單</title>
<style>
  :root { --ink:#1f2933; --muted:#6b7280; --line:#d1d5db; --bg:#f3f4f6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif; color:var(--ink); background:var(--bg); font-size:15px; line-height:1.45; }
  header { background:#111827; color:#fff; padding:12px 14px calc(10px + env(safe-area-inset-top)); position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:17px; }
  header .sub { font-size:12px; color:#cbd5e1; margin-top:3px; white-space:nowrap; }
  header .legend { font-size:11.5px; color:#e5e7eb; margin-top:5px; line-height:1.4; display:flex; flex-wrap:wrap; gap:2px 10px; white-space:nowrap; }
  .tools { display:flex; gap:6px; flex-wrap:wrap; padding:8px 10px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:4; }
  .tools button { font:inherit; font-size:12px; padding:5px 9px; border:1px solid var(--line); border-radius:14px; background:#fff; color:var(--ink); }
  .tools button.on { background:#111827; color:#fff; border-color:#111827; }
  main { max-width:760px; margin:0 auto; padding:10px 10px 90px; }
  section { background:#fff; border:1px solid var(--line); border-radius:10px; margin:10px 0; overflow:hidden; }
  section h2 { font-size:15px; margin:0; padding:8px 10px 8px 12px; background:#f9fafb; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px; cursor:pointer; user-select:none; -webkit-user-select:none; }
  section h2 .right { display:flex; align-items:center; gap:8px; flex:none; }
  .fold { font:inherit; font-size:14px; width:32px; height:28px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); padding:0; line-height:1; transition:transform .15s; }
  section.folded .fold { transform:rotate(-90deg); }
  section.folded .note, section.folded table { display:none; }
  section.folded h2 { border-bottom:none; }
  section h2 .booth { font-size:12px; color:var(--muted); font-weight:normal; white-space:nowrap; }
  section h2 .cnt { font-size:12px; color:var(--muted); font-weight:normal; }
  section .note { font-size:12px; color:var(--muted); padding:6px 12px 0; }
  table { width:100%; border-collapse:collapse; }
  tr { border-top:1px solid #eee; } tr:first-child { border-top:none; }
  td { padding:9px 8px; vertical-align:top; }
  td.ck { width:40px; padding-left:12px; } td.ck input { width:22px; height:22px; margin:2px 0 0; }
  td.pri { width:30px; padding-left:0; padding-right:0; font-size:15px; }
  td.body b { display:block; font-size:15px; }
  td.body .what { font-size:13px; color:#374151; margin-top:2px; }
  td.body .ours { display:inline-block; font-size:11px; color:#92400e; background:#fef3c7; border-radius:8px; padding:1px 7px; margin-top:4px; }
  td.body .ours.none { background:#f3f4f6; color:var(--muted); }
  tr.done td.body b, tr.done td.body .what { color:var(--muted); text-decoration:line-through; }
  tr.done td.body .ours { opacity:.55; }
  tr.hide { display:none; }
  .bar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); padding:8px 10px calc(8px + env(safe-area-inset-bottom)); display:flex; gap:8px; justify-content:center; z-index:5; }
  .bar button { font:inherit; font-size:13px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; }
  .bar button.primary { background:#111827; color:#fff; border-color:#111827; }
  dialog { border:1px solid var(--line); border-radius:12px; padding:16px; max-width:92vw; width:420px; font:inherit; }
  dialog textarea { width:100%; font:inherit; font-size:14px; min-height:64px; border:1px solid var(--line); border-radius:8px; padding:8px; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
  dialog button { font:inherit; font-size:13px; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; }
  .small { font-size:12px; color:var(--muted); }
  #lock { max-width:420px; margin:18vh auto 0; padding:20px; background:#fff; border:1px solid var(--line); border-radius:12px; }
  #lock input { width:100%; font:inherit; font-size:17px; padding:10px; border:1px solid var(--line); border-radius:8px; margin:10px 0; }
  #lock button { width:100%; font:inherit; font-size:15px; padding:10px; border-radius:8px; border:none; background:#111827; color:#fff; }
  #lock .err { color:#b91c1c; font-size:13px; min-height:18px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>G2E 2026 攤位必看清單</h1>
  <div class="sub" id="progress">請輸入密碼</div>
  <div class="legend"><span>🔴 必看（移植相關／今年趨勢）</span><span>🟡 值得看</span><span>🟢 順路</span></div>
</header>
<div id="lock">
  <b>輸入密碼解鎖</b>
  <p class="small" style="margin:6px 0 0">內容已加密存放；密碼只在這支手機記住，按底部「鎖定」可清除。</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="密碼" inputmode="text">
  <div class="err" id="err"></div>
  <button onclick="unlock()">解鎖</button>
</div>
<div class="tools hidden" id="tools">
  <button id="fAll" class="on" onclick="setFilter('all')">全部</button>
  <button id="fRed" onclick="setFilter('red')">只看 🔴</button>
  <button id="fTodo" onclick="setFilter('todo')">只看未勾</button>
  <button id="fFold" onclick="toggleAll()" style="margin-left:auto">收合全部</button>
</div>
<main id="main"></main>
<div class="bar hidden" id="bar">
  <button class="primary" onclick="openCode()">狀態碼（備份／還原）</button>
  <button onclick="resetAll()">全部清除</button>
  <button onclick="lock()">鎖定</button>
</div>
<dialog id="dlg">
  <b>狀態碼</b>
  <p class="small" style="margin:6px 0">勾完按「複製」貼到備忘錄或 LINE 群。<b>還原</b>＝用這串碼覆蓋我的勾選；<b>合併</b>＝把別人的碼加進來（他看過的也算看過，我的不會少）。</p>
  <textarea id="code"></textarea>
  <div class="small" id="lastT" style="margin-top:4px"></div>
  <div class="row"><button onclick="copyCode()">複製</button><button onclick="restoreCode()">還原</button><button onclick="mergeCode()">合併</button><button onclick="document.getElementById('dlg').close()">關閉</button></div>
</dialog>

    document.getElementById('bar').classList.remove('hidden');
    render(); fixSticky();
  } catch(e) { if (pwOverride === undefined) err.textContent = '密碼不對'; }
}
function lock(){ localStorage.removeItem(PFX+'_pw'); location.reload(); }

function get(id){ return localStorage.getItem(PFX+id)==='1'; }
function set(id,v){ localStorage.setItem(PFX+id, v?'1':'0'); localStorage.setItem(PFX+'_t', new Date().toISOString()); }
function render(){
  const m = document.getElementById('main'); m.innerHTML='';
  DATA.forEach(g=>{
    const sec = document.createElement('section');
    const done = g.items.filter(it=>get(it[0])).length;
    sec.innerHTML = '<h2><span>'+g.v+' <span class="booth">'+g.booth+'</span></span><span class="right"><span class="cnt" data-cnt="'+g.v+'">'+done+'/'+g.items.length+'</span><button class="fold" type="button" aria-label="收合／展開">▾</button></span></h2>' + (g.note?'<div class="note">'+g.note+'</div>':'') + '<table><tbody></tbody></table>';
    const tb = sec.querySelector('tbody');
    g.items.forEach(([id,pri,name,what,ours])=>{
      const tr = document.createElement('tr'); tr.dataset.id=id; tr.dataset.pri=pri;
      tr.innerHTML = '<td class="ck"><input type="checkbox" '+(get(id)?'checked':'')+'></td><td class="pri">'+pri+'</td><td class="body"><b>'+name+'</b><div class="what">'+what+'</div><span class="ours '+(ours?'':'none')+'">'+(ours?'對應：'+ours:'—')+'</span></td>';
      tr.classList.toggle('done', get(id));
      const cb = tr.querySelector('input');
      cb.addEventListener('change', ()=>{ set(id, cb.checked); tr.classList.toggle('done', cb.checked); refresh(); });
      tr.addEventListener('click', e=>{ if(e.target.tagName!=='INPUT'){ cb.checked=!cb.checked; cb.dispatchEvent(new Event('change')); } });
      tb.appendChild(tr);
    });
    sec.dataset.v = g.v; if(localStorage.getItem(PFX+'fold_'+g.v)==='1') sec.classList.add('folded');
    sec.querySelector('h2').addEventListener('click', ()=>{ const f=!sec.classList.contains('folded'); sec.classList.toggle('folded', f); localStorage.setItem(PFX+'fold_'+g.v, f?'1':'0'); updateFoldBtn(); });
    m.appendChild(sec);
  });
  refresh(); updateFoldBtn();
}
function refresh(){
  const total = ALL.length, done = ALL.filter(get).length;
  const cnt = c => { const xs=DATA.flatMap(g=>g.items).filter(it=>it[1]===c); return xs.filter(it=>get(it[0])).length+'/'+xs.length; };
  document.getElementById('progress').textContent = '已看 '+done+'/'+total+'｜🔴 '+cnt('🔴')+'｜🟡 '+cnt('🟡')+'｜🟢 '+cnt('🟢');
  DATA.forEach(g=>{ const el=document.querySelector('[data-cnt="'+g.v+'"]'); if(el) el.textContent = g.items.filter(it=>get(it[0])).length+'/'+g.items.length; });
  document.querySelectorAll('tr[data-id]').forEach(tr=>{ const d=get(tr.dataset.id), r=tr.dataset.pri==='🔴'; tr.classList.toggle('hide', (filter==='red'&&!r)||(filter==='todo'&&d)); });
  document.querySelectorAll('section').forEach(s=>{ s.style.display = s.querySelectorAll('tr[data-id]:not(.hide)').length?'':'none'; });
}
function updateFoldBtn(){ const secs=[...document.querySelectorAll('section')]; const anyOpen=secs.some(x=>!x.classList.contains('folded')); const b=document.getElementById('fFold'); if(b) b.textContent = anyOpen?'收合全部':'展開全部'; }
function toggleAll(){ const secs=[...document.querySelectorAll('section')]; const anyOpen=secs.some(x=>!x.classList.contains('folded')); secs.forEach(x=>{ x.classList.toggle('folded', anyOpen); localStorage.setItem(PFX+'fold_'+x.dataset.v, anyOpen?'1':'0'); }); updateFoldBtn(); }
function setFilter(f){ filter=f; ['All','Red','Todo'].forEach(x=>document.getElementById('f'+x).classList.toggle('on', x.toLowerCase()===f)); refresh(); }
function resetAll(){ if(!confirm('清除這支手機上的所有勾選？（建議先複製狀態碼備份）')) return; ALL.forEach(id=>localStorage.removeItem(PFX+id)); localStorage.removeItem(PFX+'_t'); render(); }
function encode(){ let n=0n; ALL.forEach((id,i)=>{ if(get(id)) n |= (1n<<BigInt(i)); }); return 'G1-'+n.toString(36); }
function parseBits(s){ s=(s||'').trim(); if(!s.startsWith('G1-')) throw new Error('格式不對，應以 G1- 開頭'); const v=parseInt(s.slice(3),36); if(Number.isNaN(v)||v<0) throw new Error('解析失敗'); return BigInt(v); }
function decode(s, merge){ let n=parseBits(s); if(merge){ let cur=0n; ALL.forEach((id,i)=>{ if(get(id)) cur |= (1n<<BigInt(i)); }); n |= cur; } ALL.forEach((id,i)=>set(id, Boolean((n>>BigInt(i))&1n))); }
function openCode(){ document.getElementById('code').value = encode(); const t=localStorage.getItem(PFX+'_t'); document.getElementById('lastT').textContent = t?('最後勾選 '+t.slice(5,16).replace('T',' ')):''; document.getElementById('dlg').showModal(); }
function copyCode(){ const ta=document.getElementById('code'); ta.select(); try{ navigator.clipboard.writeText(ta.value); }catch(e){ document.execCommand('copy'); } alert('已複製，貼到備忘錄保存'); }
function restoreCode(){ try{ decode(document.getElementById('code').value); render(); document.getElementById('dlg').close(); alert('已還原'); }catch(e){ alert('還原失敗：'+e.message); } }
function mergeCode(){ const s=document.getElementById('code').value; if(s.trim()===encode()){ alert('這是你自己的狀態碼；請先把別人的碼貼進來再按合併'); return; } const before=ALL.filter(get).length; try{ decode(s, true); render(); document.getElementById('dlg').close(); alert('已合併：新增 '+(ALL.filter(get).length-before)+' 項'); }catch(e){ alert('合併失敗：'+e.message); } }

document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });
const saved = localStorage.getItem(PFX+'_pw'); if (saved) unlock(saved);
</script>
